<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de jefes · Gauss</title>
<style>
:root{--rojo:#c0392b;--negro:#201e1e;--fondo:#f3f5f9;--azul:#1f4e79;--verde:#1b8a3a}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:#222;font-size:15px}
header{background:var(--negro);color:#fff;padding:12px 16px;border-bottom:4px solid var(--rojo);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:19px;flex:1}header h1 span{color:#ff6b5e}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.tab{background:#3a3636;color:#ddd;border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:bold;cursor:pointer;white-space:nowrap;font-family:inherit}
.tab.on{background:#fff;color:var(--negro)}
main{padding:14px 16px 70px;max-width:1000px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{margin:0 0 10px;font-size:16px;color:var(--azul)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.k{background:#f3f5f9;border-radius:10px;padding:10px}
.k span{font-size:11px;color:#666;text-transform:uppercase;display:block}
.k b{display:block;font-size:20px;margin-top:3px}
.k small{display:block;font-size:12px;color:#666;margin-top:3px}
.r{background:#f4cccc}.y{background:#fff2cc}.g{background:#d9ead3}
.up{color:var(--verde)}.down{color:var(--rojo)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#d9e2f3;text-align:left;padding:6px;white-space:nowrap}
td{padding:6px;border-bottom:1px solid #eee;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
input,select{font-size:16px;padding:9px;border:1px solid #bbb;border-radius:8px;background:#fff;font-family:inherit}
#q{width:100%;font-size:17px;padding:11px 12px;border:0;border-radius:8px;margin-top:10px;display:none}
#res{background:#fff;border-radius:8px;margin-top:6px;max-height:60vh;overflow:auto;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#res div{padding:10px 12px;border-bottom:1px solid #eee;color:#222;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#res div:hover{background:#e8f0fe}#res small{color:#777}
.badge{font-size:12px;font-weight:bold;border-radius:12px;padding:3px 8px;white-space:nowrap;align-self:center}
.bR{background:#f4cccc;color:#a61c1c}.bG{background:#d9ead3;color:#1b5e20}
.nom{font-size:21px;font-weight:bold;margin:0}.sub{color:#555;margin-top:4px}
.wa{display:inline-block;background:#25d366;color:#fff;text-decoration:none;padding:7px 12px;border-radius:18px;margin:8px 6px 0 0;font-weight:bold;font-size:13px}
.vacio{color:#999;font-style:italic}
#msg{color:#666;text-align:center;margin-top:30px}
.err{color:var(--rojo);font-weight:bold}
.btn{border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:bold;color:#fff;background:var(--azul);cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5}.btn.rojo{background:var(--rojo)}.btn.gr{background:#666}
.mini{border:0;border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer;background:#eee;font-family:inherit}
.chip{display:inline-block;border-radius:6px;padding:4px 8px;font-weight:bold}
.bar{background:#d9e2f3;border-radius:4px;height:10px;position:relative;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--azul);border-radius:4px}
.sel-sala{font-size:15px;padding:6px;min-width:84px}
.junto{background:#fff2cc!important;border-color:#b7950b!important;font-weight:bold}
.aviso{background:#fff2cc;border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtabs button{flex:1}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fila label{font-size:13px;font-weight:bold;display:block;margin-bottom:4px}
.ayuda{color:#777;font-size:12px}
header h1 span.tit{color:inherit}h1 .tit{cursor:pointer;-webkit-tap-highlight-color:transparent}h1 .tit:active{opacity:.6}
</style></head><body>
<header><div class="top"><h1><span class="tit" onclick="if(L)ir('alumno')" title="Ir al inicio">👔 Panel de jefes <span>Gauss</span></span></h1></div>
<div class="tabs" id="tabs" style="display:none">
<button class="tab" data-t="alumno" onclick="ir('alumno')">🔎 Alumno</button>
<button class="tab" data-t="mes" onclick="ir('mes')">📅 Cómo va el mes</button>
<button class="tab" data-t="grupos" onclick="ir('grupos')">🏫 Grupos y salas</button>
<button class="tab" data-t="tend" onclick="ir('tend')">📈 Tendencias</button>
<button class="tab" data-t="cuot" onclick="ir('cuot')">💳 Cuotero</button>
</div>
<input id="q" placeholder="Buscá al alumno por nombre, apellido o ID…" autocomplete="off" oninput="filtrar()">
<div id="res"></div></header>
<main><div id="app"></div><div id="msg">Cargando…</div></main>
<script>
var API='https://script.google.com/macros/s/AKfycbzPNqOlPMgP1lme__szBCxU4kzz7fSJ3PxLxUZu_CcywI5ftsESe6e7hL63z1Xp7M6U/exec';
var PIN='';try{PIN=localStorage.getItem('gaussPinJefe')||'';}catch(e){}
var L=null,GR=null,TAB='';
// ⚡ Supabase: copia rápida (solo lectura). Si falla o no está, se usa la planilla como siempre.
var SB_URL='https://heycvwxaewjbwbusddqg.supabase.co',SB_KEY='sb_publishable_MpClcQrbgiAtqcsaa5js3w_XCYqHztI';
var NAV=0,TOCADO=false,NUEVO=null;
function sbLeer(tipo,clave,ok,mal){
 if(!PIN){mal();return;}
 var hecho=false,to=setTimeout(function(){if(!hecho){hecho=true;mal();}},4000);
 fetch(SB_URL+'/rest/v1/rpc/gauss_leer',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
  body:JSON.stringify({p_pin:PIN,p_tipo:tipo,p_clave:String(clave)})})
 .then(function(r){return r.json();})
 .then(function(d){if(hecho)return;hecho=true;clearTimeout(to);if(d&&d.datos)ok(d.datos,d.t);else mal();})
 .catch(function(){if(hecho)return;hecho=true;clearTimeout(to);mal();});}
function estable(o){if(Array.isArray(o))return '['+o.map(estable).join(',')+']';
 if(o&&typeof o==='object')return '{'+Object.keys(o).filter(function(k){return k!=='_ms'&&k!=='_total'&&o[k]!==undefined;}).sort()
  .map(function(k){return JSON.stringify(k)+':'+estable(o[k]);}).join(',')+'}';
 return JSON.stringify(o);}
function haceCuanto(t){var m=Math.round((Date.now()-new Date(t).getTime())/60000);return isNaN(m)?'':(m<1?'recién':m<60?'hace '+m+' min':'hace '+Math.round(m/60)+' h');}
function sbMarca(h){var m=el('sbMarca');if(!m){m=document.createElement('div');m.id='sbMarca';m.style.cssText='font-size:12px;color:#777;text-align:center;margin:0 0 8px';
  var a=el('app');a.parentNode.insertBefore(m,a);}m.innerHTML=h||'';}
// Muestra la copia de Supabase al instante y después confirma con la planilla.
// "refresco" (opcional): qué hacer con los datos nuevos de la planilla (si no, se vuelve a usar "ok").
function rapido(acc,params,tipo,clave,ok,mal,refresco){
 var n=++NAV;sbMarca('');
 sbLeer(tipo,clave,function(d,t){
  if(n!==NAV)return;TOCADO=false;ok(d);sbMarca('⚡ Vista rápida · confirmando con la planilla…');
  pedir(acc,params,function(D){
   if(n!==NAV)return;
   if(estable(D)===estable(d)){sbMarca('✅ Confirmado con la planilla');setTimeout(function(){if(n===NAV)sbMarca('');},2500);return;}
   var aplicar=function(){var y=window.scrollY;(refresco||ok)(D);window.scrollTo(0,y);sbMarca('');};
   if(!TOCADO||refresco){aplicar();return;}
   NUEVO=aplicar;sbMarca('<b style="color:#b45f06">🔄 La planilla tiene datos más nuevos.</b> <button onclick="NUEVO()" style="font-size:12px">Actualizar</button>');
  },function(e){if(n!==NAV)return;if(String(e.message||'').indexOf('PIN:')>=0){mal(e);return;}
   sbMarca('<span style="color:#c0392b">⚠️ No se pudo confirmar con la planilla (se ve la vista rápida).</span>');});
 },function(){if(n===NAV)pedir(acc,params,function(D){if(n===NAV)ok(D);},function(e){if(n===NAV)mal(e);});});}
function numBusca(q,nums){var d=String(q).replace(/\D/g,'');if(d.length<4||/[a-záéíóúñ]/i.test(q))return false;d=d.replace(/^595/,'').replace(/^0+/,'');if(d.length<3)return false;
 return String(nums||'').split(' ').some(function(t){return t&&t.indexOf(d)>=0;});}   // 🔎 buscar por CI o celular
function el(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sa(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function gs(n){n=Number(n)||0;return (n<0?'− ':'')+'Gs. '+Math.round(Math.abs(n)).toLocaleString('es-PY');}
function mil(n){n=Number(n)||0;return Math.round(n).toLocaleString('es-PY');}
function guardado(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v);}catch(e){return '';}}
function msg(t){el('msg').innerHTML=t||'';}
function pedir(acc,params,ok,mal){
 var q='accion='+acc+'&pin='+encodeURIComponent(PIN);
 for(var k in params)q+='&'+k+'='+encodeURIComponent(params[k]==null?'':params[k]);
 fetch(API+'?'+q,{credentials:'omit'}).then(function(r){return r.json();})
 .then(function(d){if(d&&d.error)mal({message:d.error});else ok(d);})
 .catch(function(){mal({message:'No pude conectar. Revisá la conexión y probá de nuevo.'});});}
function falla(e,dest){var m=String(e.message||e);
 if(m.indexOf('PIN:')>=0){pedirPin(m.replace(/^.*PIN:\s*/,''));return;}
 if(dest&&el(dest))el(dest).innerHTML='<div class="err">⚠️ '+esc(m)+'</div>';else msg('<span class="err">⚠️ '+esc(m)+'</span>');}
function pedirPin(m){el('tabs').style.display='none';el('q').style.display='none';msg('');
 el('app').innerHTML='<div class="card" style="text-align:center"><h2>🔒 Panel de jefes</h2><div style="margin-bottom:10px;color:'+(m.indexOf('Ingres')===0?'#555':'#c0392b')+'">'+esc(m)+'</div>'+
 '<input id="pin" type="password" inputmode="numeric" placeholder="PIN" style="font-size:22px;width:180px;text-align:center"><br><button class="btn rojo" style="margin-top:12px" onclick="entrar()">Entrar</button></div>';
 var i=el('pin');i.focus();i.onkeydown=function(ev){if(ev.key==='Enter')entrar();};}
function entrar(){PIN=el('pin').value.trim();guardado('gaussPinJefe',PIN);cargar();}
function cargar(){el('app').innerHTML='';msg('Cargando…');
 function listo(){el('tabs').style.display='flex';ir(guardado('gaussJefeTab')||'alumno');}
 sbLeer('pagosLista','todo',function(d){L=d;listo();
   pedir('lista',{},function(d2){L=d2;if(el('res').style.display==='block')filtrar();},function(e){if(String(e.message||'').indexOf('PIN:')>=0)falla(e);});},
  function(){pedir('lista',{},function(d){L=d;listo();},function(e){falla(e);});});}
el('app').addEventListener('input',function(){TOCADO=true;});
cargar();
// ◀ deslizar para atrás: vuelve a la pestaña o ficha anterior
window.addEventListener('popstate',function(e){var s=e.state||{};if(s.ficha){ficha(s.ficha,true);return;}ir(s.tab||'alumno',true);});
function ir(t,desdeHist){if(!TAB&&window.history&&history.replaceState){try{history.replaceState({tab:t},'');}catch(e){}}if(!desdeHist&&TAB&&TAB!==t&&window.history&&history.pushState){try{history.pushState({tab:t},'');}catch(e){}}TAB=t;NAV++;sbMarca('');guardado('gaussJefeTab',t);msg('');el('res').style.display='none';
 [].forEach.call(document.querySelectorAll('.tab'),function(b){b.className='tab'+(b.getAttribute('data-t')===t?' on':'');});
 el('q').style.display=t==='alumno'?'block':'none';window.scrollTo(0,0);
 if(t==='alumno')inicioAlumno();else if(t==='mes')verMes(guardado('gaussJefeMes')||'');else if(t==='grupos')verGrupos();else if(t==='cuot')verCuot();else verTend();}
function k(t,v,cl,sub){return '<div class="k '+(cl||'')+'"><span>'+esc(t)+'</span><b>'+(v===''||v==null?'–':v)+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div>';}
function delta(a,b,txtPrev,inverso){if(b===null||b===undefined)return '';var d=a-b;if(!d)return 'igual que '+esc(txtPrev);
 var bien=inverso?d<0:d>0;return '<span class="'+(bien?'up':'down')+'">'+(d>0?'▲ ':'▼ ')+(Math.abs(d)>=1000?mil(Math.abs(d)):Math.abs(d))+'</span> vs '+esc(txtPrev);}
function tabla(enc,filas,der){der=der||[];
 if(!filas.length)return '<div class="vacio">— sin datos —</div>';
 return '<div class="scroll"><table><tr>'+enc.map(function(e,i){return '<th'+(der.indexOf(i)>=0?' class="n"':'')+'>'+esc(e)+'</th>';}).join('')+'</tr>'+
  filas.map(function(f){return '<tr>'+f.map(function(c,i){return '<td'+(der.indexOf(i)>=0?' class="n"':'')+'>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';}
function waLink(cel,txt){var d=String(cel||'').replace(/\D/g,'');if(d.length<7)return '';if(d.charAt(0)==='0')d='595'+d.slice(1);
 return '<a class="wa" href="https://wa.me/'+d+'" target="_blank">📲 '+esc(txt)+'</a>';}

// ================= 🔎 ALUMNO =================
function inicioAlumno(){el('app').innerHTML='';el('q').value='';
 msg(L?L.alumnos.length+' alumnos. Escribí arriba para buscar.':'');el('q').focus();}
function filtrar(){var q=sa(el('q').value.trim()),r=el('res');
 if(!L||q.length<2){r.style.display='none';return;}
 var p=q.split(/\s+/),h=L.alumnos.filter(function(x){var t=sa(x[0]+' '+x[1]+' '+x[2]);return p.every(function(w){return t.indexOf(w)>=0;})||numBusca(q,x[5]);}).slice(0,30);
 r.innerHTML=h.length?h.map(function(x){return '<div onclick="ficha(\''+esc(x[0])+'\')"><span>'+esc(x[1])+'<br><small>'+esc(x[0])+' · '+esc(x[2]||'sin grupo')+' · '+esc(x[3])+'</small></span>'+
  '<span class="badge '+(x[4]>0?'bR':'bG')+'">'+(x[4]>0?'Debe '+gs(x[4]):'Al día')+'</span></div>';}).join(''):'<div class="vacio">No hay coincidencias</div>';
 r.style.display='block';}
function ficha(id,desdeHist){if(!desdeHist&&window.history&&history.pushState){try{history.pushState({ficha:id,tab:TAB},'');}catch(e){}}el('res').style.display='none';el('q').blur();el('app').innerHTML='';msg('Cargando ficha…');
 rapido('jefeFicha',{id:id},'jefeFicha',id,pintarFicha,function(e){falla(e);});}
function pintarFicha(f){msg('');var c=f.csa||{};
 var sc=c.sem==='🔴'?'r':(c.sem==='🟡'?'y':(c.sem==='🟢'?'g':''));
 var pc=function(v){var n=parseFloat(v);return isNaN(n)?'':(n<70?'r':(n<85?'y':'g'));};
 var h='<div class="card '+sc+'"><div style="display:flex;gap:12px;align-items:center"><div style="font-size:32px">'+esc(c.sem||'')+'</div><div><p class="nom">'+esc(f.nombre)+'</p>'+
  '<div class="sub">'+esc(f.id)+' · '+esc(f.grupo||'sin grupo')+' · '+esc(f.situacion)+'</div>'+(f.plan?'<div class="sub">Plan: '+esc(f.plan)+'</div>':'')+'</div></div>'+
  (c.motivos?'<div style="margin-top:8px"><b>Motivos:</b> '+esc(c.motivos)+'</div>':'')+
  (c.seguimiento?'<div><b>Seguimiento:</b> '+esc(c.seguimiento)+'</div>':'')+'</div>';
 h+='<div class="card"><h2>💰 Pagos</h2><div class="grid">'+
  k('Deuda vencida',gs(f.deuda),f.deuda>0?'r':'g',f.multas?'de eso, multas '+gs(f.multas):'')+
  k('Cuotas vencidas',f.impagas||0,f.impagas>1?'r':'')+
  k('Próximo vencimiento',f.prox?esc(f.prox.venc):'–','',f.prox?gs(f.prox.monto):'')+
  (f.favor?k('Saldo a favor',gs(f.favor),'g'):'')+'</div></div>';
 h+='<div class="card"><h2>📅 Asistencia y notas</h2>'+(f.csa?'<div class="grid">'+
  k('Asistencia total',c.total===''?'':c.total+'%',pc(c.total))+k('Últimos 30 días',c.d30===''?'':c.d30+'%',pc(c.d30))+
  k('Faltas esta semana',c.faltasSem||0,c.faltasSem>0?'y':'')+k('Última vez que vino',esc(c.ultVino||''))+k('Última ausencia',esc(c.ultAus))+
  k('Promedio exámenes',c.prom,c.prom===''?'':(c.prom<40?'r':(c.prom<60?'y':'g')),c.tend?esc(c.tend):'')+
  k('Último contacto',esc(c.ultContacto))+'</div>'+(c.prof?'<div class="sub" style="margin-top:8px">Prof. encargado: '+esc(c.prof)+'</div>':''):
  '<div class="vacio">'+esc(f.csaError||'Todavía no figura en el CSA.')+'</div>')+'</div>';
 h+='<div class="card"><h2>📇 Contacto</h2><div>Celular: '+esc(f.cel||'–')+'</div><div>Responsable: '+esc(f.resp||'–')+' · '+esc(f.celResp||'–')+'</div>'+
  waLink(f.cel,'WhatsApp alumno')+waLink(f.celResp,'WhatsApp responsable')+'</div>';
 var cu=f.cuotas.filter(function(x){return x.estado!=='Pagado'&&x.estado!=='Perdonada';}).concat(f.cuotas.filter(function(x){return x.estado==='Pagado'||x.estado==='Perdonada';}).slice(-3));
 h+='<div class="card"><h2>🗓️ Cuotas</h2>'+tabla(['Concepto','Vence','Monto','Pagado','Saldo','Estado'],cu.map(function(x){
  var cl=x.estado==='Vencido'?'r':(x.estado==='Pagado'||x.estado==='Perdonada'?'g':(x.estado==='Parcial'?'y':''));
  return [esc(x.concepto),esc(x.vence),mil(x.monto),x.pagado?mil(x.pagado):'–',x.saldo?mil(x.saldo):'–','<span class="chip '+cl+'">'+esc(x.estado)+'</span>'];}),[2,3,4])+'</div>';
 h+='<div class="card"><h2>💵 Últimos pagos</h2>'+tabla(['Fecha','Monto','Medio','Tipo'],f.pagos.map(function(p){return [esc(p.fecha),mil(p.monto),esc(p.medio),esc(p.tipo)];}),[1])+'</div>';
 if(f.obs&&f.obs.length)h+='<div class="card"><h2>🗒️ Últimas observaciones (CSA)</h2>'+tabla(['Fecha','Tipo','Detalle','Anotó'],f.obs.map(function(o){return [esc(o.fecha),esc(o.tipo),esc(o.detalle),esc(o.quien)];}))+'</div>';
 if(f.anotaciones&&f.anotaciones.length)h+='<div class="card"><h2>📝 Anotaciones de cobranza</h2>'+tabla(['Fecha','Quién','Anotación'],f.anotaciones.map(function(o){return [esc(o.fecha),esc(o.quien),esc(o.obs)];}))+'</div>';
 h+='<div style="text-align:center"><button class="btn gr" onclick="inicioAlumno();window.scrollTo(0,0)">🏠 Cerrar ficha</button></div>';
 el('app').innerHTML=h;window.scrollTo(0,0);}

// ================= 📅 CÓMO VA EL MES =================
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function opcionesMes(sel){var d=new Date(),o='';for(var i=0;i<12;i++){var y=d.getFullYear(),m=d.getMonth()+1,v=y+'-'+('0'+m).slice(-2);
  o+='<option value="'+v+'"'+(v===sel?' selected':'')+'>'+MESES[m-1].charAt(0).toUpperCase()+MESES[m-1].slice(1)+' '+y+(i===0?' (este mes)':'')+'</option>';d.setMonth(d.getMonth()-1);}return o;}
function verMes(mes){if(!mes){var d=new Date();mes=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}guardado('gaussJefeMes',mes);
 el('app').innerHTML='<div class="card"><div class="fila"><div><label>Mes</label><select onchange="verMes(this.value)">'+opcionesMes(mes)+'</select></div></div></div><div id="mesC"><div class="card">Calculando… (puede tardar unos segundos)</div></div>';
 rapido('jefeMes',{mes:mes},'jefeMes',mes,pintarMes,function(e){falla(e,'mesC');});}
function pintarMes(X){if(TAB!=='mes')return;var h='',pv=X.nombrePrev;
 var res=X.cob.total-(X.gastos?X.gastos.total:0),cz=X.cobranza,pctC=cz.monto?Math.round((cz.aTiempo+cz.tarde)/cz.monto*100):null;
 h+='<div class="card"><h2>📅 '+esc(X.titulo)+(X.enCurso?' · hasta hoy ('+esc(X.corte)+')':'')+'</h2><div class="grid">'+

var MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function verCuot(){el('app').innerHTML='<div class="card">Cargando el cuotero…</div>';
 rapido('jefeCuotero',{},'jefeCuotero','todo',function(d){CQ=d;if(TAB==='cuot')pintarCuot();},function(e){falla(e);});}
function cqFiltrados(){var G=CQ.grupos;return CQ.alumnos.filter(function(x){var g=G[x.g]||{};
 if(CQ_F.indexOf('mod:')===0&&g.mod!==CQ_F.slice(4))return false;if(CQ_F.indexOf('cur:')===0&&g.curso!==CQ_F.slice(4))return false;
 if(CQ_G&&x.g!==CQ_G)return false;return true;});}
function cqNum(l){var hoy=CQ.hoy,R={deuda:0,nDeuda:0,salio:0,nSalio:0,c1:0,c0:0,mM:0,mS:0,alDia:0,dos:0,esp:0,espM:0,v7:0,act:0};
 l.forEach(function(x){
  if(x.a){R.act++;R.deuda+=x.d;if(x.d>0)R.nDeuda++;else R.alDia++;}else if(x.d>0){R.salio+=x.d;R.nSalio++;}
  R.c1+=x.c1;R.c0+=x.c0;R.v7+=x.v7;
  var c=x.m[hoy];if(c&&c[0]!=='B'){R.mM+=c[2];R.mS+=c[1];}
  var nv=0,e=0;Object.keys(x.m).forEach(function(k){var y=x.m[k];if(y[0]==='V'||y[0]==='Y')nv++;if(y[0]==='E')e+=y[1];});
  if(nv>=2&&x.a)R.dos++;if(e>0){R.esp++;R.espM+=e;}});
 return R;}
function cqMesTxt(k,conAnio){var p=k.split('-');return MES3[Number(p[1])-1]+(conAnio?' '+p[0].slice(2):'');}
function pintarCuot(){if(!CQ)return;var l=cqFiltrados(),R=cqNum(l),G=CQ.grupos;
 var mods={},curs={};Object.keys(G).forEach(function(g){if(G[g].mod)mods[G[g].mod]=1;if(G[g].curso)curs[G[g].curso]=1;});
 var opt=function(v,t){return '<option value="'+esc(v)+'"'+(CQ_F===v?' selected':'')+'>'+esc(t)+'</option>';};
 var grs=Object.keys(G).filter(function(g){var x=G[g];return CQ_F==='todos'||(CQ_F.indexOf('mod:')===0&&x.mod===CQ_F.slice(4))||(CQ_F.indexOf('cur:')===0&&x.curso===CQ_F.slice(4));})
  .sort(function(a,b){return a.localeCompare(b,'es',{numeric:true});});
 if(CQ_G&&grs.indexOf(CQ_G)<0)CQ_G='';
 var pctMes=R.mM?Math.round((R.mM-R.mS)/R.mM*100):null,d=R.c1-R.c0;
 var h='<div class="card"><h2>💳 Cuotero <span class="ayuda" style="font-weight:normal">· al '+esc(CQ.dia)+'</span></h2><div class="grid">'+
  k('Deuda vencida',gs(R.deuda),R.deuda>0?'r':'g',R.nDeuda+' de '+R.act+' alumnos activos')+
  k('Cobrado este mes',gs(R.c1),'',d?'<span class="'+(d>0?'up':'down')+'">'+(d>0?'▲ ':'▼ ')+gs(Math.abs(d))+'</span> vs el mes pasado a esta fecha':'igual que el mes pasado')+
  k('Cuotas de este mes',pctMes===null?'–':pctMes+'% cobrado',pctMes===null?'':(pctMes>=80?'g':(pctMes>=60?'y':'r')),R.mS?'faltan '+gs(R.mS):'')+
  k('Al día · con deuda',R.alDia+' · '+R.nDeuda,'','alumnos activos')+
  k('2 o más cuotas vencidas',R.dos,R.dos?'r':'')+
  k('En espera ⏳',R.esp,'',R.esp?gs(R.espM):'')+
  k('Vence en los próximos 7 días',gs(R.v7))+
  k('Deuda de los que salieron',gs(R.salio),R.salio?'y':'',R.nSalio+' alumnos')+'</div></div>';
 h+='<div class="card"><div class="fila"><div style="flex:1;min-width:180px"><label>Ver</label><select style="width:100%" onchange="CQ_F=this.value;guardado(\'gaussCuotF\',CQ_F);CQ_G=\'\';pintarCuot()">'+
  opt('todos','Todos')+'<optgroup label="Modalidad">'+Object.keys(mods).sort().map(function(m){return opt('mod:'+m,m);}).join('')+'</optgroup>'+
  '<optgroup label="Curso">'+Object.keys(curs).sort().map(function(c){return opt('cur:'+c,c);}).join('')+'</optgroup></select></div>'+
  '<div style="flex:1;min-width:180px"><label>Grupo</label><select style="width:100%" onchange="CQ_G=this.value;pintarCuot()"><option value="">Todos los grupos</option>'+
  grs.map(function(g){return '<option'+(g===CQ_G?' selected':'')+'>'+esc(g)+'</option>';}).join('')+'</select></div></div>'+
  '<div style="margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;font-size:14px">'+
  '<label><input type="checkbox" style="width:auto;padding:0"'+(CQ_DEBEN?' checked':'')+' onchange="CQ_DEBEN=this.checked;pintarCuot()"> Solo los que deben</label>'+
  '<label><input type="checkbox" style="width:auto;padding:0"'+(CQ_MONTOS?' checked':'')+' onchange="CQ_MONTOS=this.checked;guardado(\'gaussCuotMontos\',CQ_MONTOS?\'1\':\'0\');pintarCuot()"> Mostrar montos (en miles)</label></div></div>';
 h+='<div class="card" style="padding:10px"><div id="cqT"></div><div class="ayuda" style="margin-top:8px">'+
  ['P','V','Y','E','F','B'].map(function(c){return '<span style="display:inline-block;width:12px;height:12px;border:1px solid #999;background:'+CQ_COL[c]+';vertical-align:middle"></span> '+CQ_TXT[c];}).join(' &nbsp; ')+
  (CQ_MONTOS?'<br>Montos en miles: 700 = Gs. 700.000.':'')+'</div>'+
  '<button class="btn" style="margin-top:10px" onclick="imagenCuot()">📲 Compartir imagen</button></div>';
 el('app').innerHTML=h;
 el('cqT').innerHTML=tablaCuot(l);}
function cqMeses(l){var m={};l.forEach(function(x){Object.keys(x.m).forEach(function(k){m[k]=1;});});return Object.keys(m).sort();}
function cqFilas(l){var out=[],porG={};l.forEach(function(x){(porG[x.g]=porG[x.g]||[]).push(x);});
 Object.keys(porG).sort(function(a,b){return a.localeCompare(b,'es',{numeric:true});}).forEach(function(g){
  var act=porG[g].filter(function(x){return x.a&&(!CQ_DEBEN||x.d>0);}),sal=porG[g].filter(function(x){return !x.a&&x.d>0;});
  if(!act.length&&!sal.length)return;out.push({grupo:g,n:act.length});
  act.forEach(function(x){out.push({al:x});});sal.forEach(function(x){out.push({al:x,salio:true});});});
 return out;}
function tablaCuot(l){var meses=cqMeses(l),filas=cqFilas(l);if(!filas.length)return '<div class="vacio">— nadie para mostrar —</div>';
 var dosAnios=meses.length&&meses[0].slice(0,4)!==meses[meses.length-1].slice(0,4),W=CQ_MONTOS?44:26;
 var h='<div class="scroll" style="max-height:70vh;overflow:auto"><table style="width:auto;border-collapse:separate;border-spacing:0;font-size:12px">'+
  '<tr><th style="position:sticky;left:0;top:0;z-index:3;background:#d9e2f3;min-width:130px;max-width:150px">Alumno</th>'+
  meses.map(function(k,i){var anio=dosAnios&&(i===0||k.slice(5)==='01');return '<th style="position:sticky;top:0;z-index:2;text-align:center;padding:3px 1px;font-size:11px;line-height:1.1;width:'+W+'px;min-width:'+W+'px;max-width:'+W+'px'+(k===CQ.hoy?';background:#ffe599':'')+'">'+cqMesTxt(k,false)+(anio?'<br><small style="font-weight:normal">'+k.slice(2,4)+'</small>':'')+'</th>';}).join('')+
  '<th class="n" style="position:sticky;top:0;z-index:2">Debe'+(CQ_MONTOS?'':'')+'</th></tr>';
 filas.forEach(function(f){
  if(f.grupo){h+='<tr><td colspan="'+(meses.length+2)+'" style="background:#201e1e;color:#fff;font-weight:bold;padding:5px 6px;position:sticky;left:0">'+esc(f.grupo)+' <span style="font-weight:normal;opacity:.75">· '+f.n+'</span></td></tr>';return;}
  var x=f.al,nm='<td title="'+esc(x.n)+'" style="position:sticky;left:0;background:'+(f.salio?'#eee':'#fff')+';z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;padding:3px 6px;border-bottom:1px solid #eee'+(f.salio?';color:#888':'')+'">'+esc(x.n)+'</td>';
  if(f.salio){h+='<tr>'+nm+'<td colspan="'+meses.length+'" style="background:#eee;color:#888;font-style:italic;padding:3px 6px">salió</td><td class="n" style="background:#eee;color:#a61c1c;font-weight:bold;padding:3px 6px">'+mil(x.d/1000)+'</td></tr>';return;}
  h+='<tr>'+nm+meses.map(function(k){var c=x.m[k];if(!c)return '<td style="background:#f3f3f3;border:1px solid #fff"></td>';
   var t=CQ_MONTOS&&c[1]>0&&c[0]!=='F'?mil(c[1]/1000):'';
   return '<td title="'+esc(cqMesTxt(k,true)+': '+CQ_TXT[c[0]]+(c[1]>0?' · debe '+gs(c[1]):''))+'" style="background:'+CQ_COL[c[0]]+';border:1px solid #fff;text-align:center;padding:3px 2px;font-size:11px">'+t+'</td>';}).join('')+
   '<td class="n" style="padding:3px 6px;font-weight:bold;'+(x.d>0?'color:#a61c1c':'color:#1b5e20')+'">'+(x.d>0?mil(x.d/1000):'✓')+'</td></tr>';});
 // totales por mes: % cobrado de lo que ya venció
 var tot=meses.map(function(k){var M=0,S=0;l.forEach(function(x){var c=x.m[k];if(c&&c[0]!=='B'&&c[0]!=='F'&&c[0]!=='X'){M+=c[2];S+=c[1];}});return M?Math.round((M-S)/M*100):null;});
 h+='<tr><td style="position:sticky;left:0;background:#d9e2f3;font-weight:bold;padding:4px 6px">% cobrado</td>'+tot.map(function(p){return '<td style="background:#d9e2f3;text-align:center;font-size:10px;font-weight:bold;padding:4px 1px">'+(p===null?'':p+'%')+'</td>';}).join('')+'<td style="background:#d9e2f3"></td></tr>';
 return h+'</table></div>'+(CQ_MONTOS?'':'<div class="ayuda" style="margin-top:4px">"Debe" en miles: 4.200 = Gs. 4.200.000.</div>');}
// imagen para WhatsApp (lo que se ve con el filtro elegido)
function imagenCuot(){var l=cqFiltrados(),meses=cqMeses(l),filas=cqFilas(l);if(!filas.length)return;
 var cN=230,cw=CQ_MONTOS?46:28,rh=22,x0=14,W=x0*2+cN+cw*meses.length+70,H=60+rh*(filas.length+2)+30,s=2,cv=document.createElement('canvas');
 cv.width=W*s;cv.height=H*s;var c=cv.getContext('2d');c.scale(s,s);c.fillStyle='#fff';c.fillRect(0,0,W,H);c.textBaseline='middle';
 var tit='CUOTERO · '+(CQ_G||(CQ_F==='todos'?'TODOS':CQ_F.slice(4)))+' · al '+CQ.dia;
 c.fillStyle='#201e1e';c.font='bold 16px Arial';c.textAlign='left';c.fillText(tit,x0,22);
 var y=44,dosAnios=meses.length&&meses[0].slice(0,4)!==meses[meses.length-1].slice(0,4);
 c.font='bold 11px Arial';c.textAlign='center';meses.forEach(function(k,i){c.fillStyle=k===CQ.hoy?'#b45f06':'#333';c.fillText(cqMesTxt(k,dosAnios),x0+cN+cw*i+cw/2,y+rh/2);});
 c.textAlign='right';c.fillStyle='#333';c.fillText('Debe (mil)',W-x0,y+rh/2);y+=rh;
 filas.forEach(function(f){
  if(f.grupo){c.fillStyle='#201e1e';c.fillRect(x0,y,W-2*x0,rh);c.fillStyle='#fff';c.font='bold 12px Arial';c.textAlign='left';c.fillText(f.grupo+' · '+f.n,x0+6,y+rh/2+1);y+=rh;return;}
  var x=f.al;c.font='12px Arial';c.textAlign='left';c.fillStyle=f.salio?'#999':'#222';
  var nom=x.n;while(c.measureText(nom).width>cN-10&&nom.length>4)nom=nom.slice(0,-2);if(nom!==x.n)nom+='…';c.fillText(nom,x0+4,y+rh/2+1);
  if(f.salio){c.fillStyle='#eee';c.fillRect(x0+cN,y+1,cw*meses.length,rh-2);c.fillStyle='#999';c.font='italic 11px Arial';c.fillText('salió',x0+cN+6,y+rh/2+1);}
  else meses.forEach(function(k,i){var v=x.m[k];c.fillStyle=v?CQ_COL[v[0]]:'#f3f3f3';c.fillRect(x0+cN+cw*i+1,y+1,cw-2,rh-2);
   if(v&&v[0]==='F'){c.strokeStyle='#ccc';c.strokeRect(x0+cN+cw*i+1.5,y+1.5,cw-3,rh-3);}
   if(CQ_MONTOS&&v&&v[1]>0&&v[0]!=='F'){c.fillStyle='#000';c.font='10px Arial';c.textAlign='center';c.fillText(mil(v[1]/1000),x0+cN+cw*i+cw/2,y+rh/2+1);}});
  c.textAlign='right';c.font='bold 12px Arial';c.fillStyle=x.d>0?'#a61c1c':'#1b5e20';c.fillText(x.d>0?mil(x.d/1000):'✓',W-x0,y+rh/2+1);y+=rh;});
 c.fillStyle='#888';c.font='11px Arial';c.textAlign='left';c.fillText('Verde pagado · rojo vencida · amarillo pagó una parte · naranja en espera · blanco por vencer · celeste beca',x0,y+16);
 c.textAlign='right';c.fillText('Cursillo Gauss',W-x0,y+16);
 var nombre='Cuotero '+(CQ_G||(CQ_F==='todos'?'todos':CQ_F.slice(4)))+' '+CQ.dia.replace(/\//g,'-')+'.png';
 cv.toBlob(function(b){var file=null;try{file=new File([b],nombre,{type:'image/png'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:nombre}).catch(function(){});return;}
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();a.remove();},'image/png');}
</script></body></html>
