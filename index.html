<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Fran · Gauss</title>
<style>
:root{--rojo:#c0392b;--negro:#201e1e;--fondo:#f3f5f9;--azul:#1f4e79;--verde:#1b8a3a}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:#222;font-size:16px}
header{background:var(--negro);color:#fff;padding:14px 16px;border-bottom:4px solid var(--rojo);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;flex:1}header h1 span{color:#ff6b5e}
#volver{display:none;background:#444;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
main{padding:14px 16px 70px;max-width:820px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{margin:0 0 10px;font-size:17px;color:var(--azul)}
.botones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bgrande{display:block;text-align:left;border:0;border-radius:14px;padding:18px;font-size:19px;font-weight:bold;cursor:pointer;color:#fff;min-height:96px;font-family:inherit}
.bgrande small{display:block;font-weight:normal;font-size:13px;opacity:.9;margin-top:6px}
label{display:block;font-weight:bold;margin-top:12px;font-size:14px}
input,select{width:100%;font-size:17px;padding:10px;border:1px solid #bbb;border-radius:8px;margin-top:4px;background:#fff;font-family:inherit}
input[type=checkbox]{width:auto;transform:scale(1.3);margin:0 8px 0 0}
.fila{display:flex;gap:12px}.fila>div{flex:1;min-width:0}
@media(max-width:600px){.fila{flex-direction:column;gap:0}}
.btn{display:block;width:100%;font-size:18px;padding:14px;background:var(--rojo);color:#fff;border:0;border-radius:12px;cursor:pointer;font-weight:bold;margin-top:16px;font-family:inherit}
.btn:disabled{opacity:.6}.btn.az{background:var(--azul)}.btn.gr{background:#666}
.ayuda{color:#777;font-size:13px;font-weight:normal}
.err{color:var(--rojo);font-weight:bold;margin-top:10px}
#msg{color:#666;text-align:center;margin-top:30px}
.pdf{border:1px solid #e3e3e3;border-radius:12px;padding:12px;margin-top:10px}
.pdf b{display:block;font-size:15px}.pdf small{color:#777}
.acc{display:inline-block;border:0;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:bold;color:#fff;cursor:pointer;margin:8px 6px 0 0;font-family:inherit;text-decoration:none}
.chip{display:inline-block;border:1px solid #bbb;border-radius:18px;padding:7px 12px;margin:4px 6px 0 0;font-size:14px;cursor:pointer;background:#fff;user-select:none}
.chip.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.gr-curso{margin-top:10px}.gr-curso b{font-size:13px;color:#555}
.gr-item{display:inline-flex;align-items:center;border:1px solid #ddd;border-radius:8px;padding:6px 10px;margin:4px 6px 0 0;font-size:14px;cursor:pointer;background:#fff}
.gr-item.on{background:#e8f0fe;border-color:var(--azul)}
.paso{display:inline-block;background:var(--azul);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;margin-right:6px;font-size:14px}
.aviso{background:#fff2cc;border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
.ok{background:#d9ead3;border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
.auto{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{border:0;border-radius:18px;padding:8px 14px;font-weight:bold;cursor:pointer;font-family:inherit}
.sw.on{background:var(--verde);color:#fff}.sw.off{background:#ddd;color:#333}
.rp-fila{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #eee;cursor:pointer;font-size:16px;user-select:none}.rp-fila.on{background:#e8f0fe}.rp-fila small{margin-left:auto;color:#777;font-size:12px;white-space:nowrap}.rp-fila .emp{color:#c0392b}
.rp-barra{position:sticky;bottom:0;background:#fff;padding:10px 0 2px;border-top:1px solid #ddd}
.ct-chip{display:inline-block;border:1px solid #bbb;border-radius:18px;padding:7px 12px;margin:4px 6px 0 0;font-size:14px;cursor:pointer;background:#fff;user-select:none}.ct-chip.on{background:#1f4e79;color:#fff;border-color:#1f4e79}.ct-g{display:inline-flex;align-items:center;border:1px solid #ddd;border-radius:8px;padding:6px 10px;margin:4px 6px 0 0;font-size:14px;cursor:pointer;background:#fff;user-select:none}.ct-g.on{background:#e8f0fe;border-color:#1f4e79}.ct-k{margin-top:10px}.ct-k b{font-size:13px;color:#555}
header h1 span.tit{color:inherit}h1 .tit{cursor:pointer;-webkit-tap-highlight-color:transparent}h1 .tit:active{opacity:.6}
</style></head><body>
<header><h1><span class="tit" onclick="if(GR&&INFO)inicio()" title="Ir al inicio">🧑‍💻 Panel de Fran <span>Gauss</span></span></h1><button id="volver" onclick="inicio()">⬅ Inicio</button></header>
<main><div id="app"></div><div id="msg">Cargando…</div></main>
<script>
var API_ADM='https://script.google.com/macros/s/AKfycbzPNqOlPMgP1lme__szBCxU4kzz7fSJ3PxLxUZu_CcywI5ftsESe6e7hL63z1Xp7M6U/exec';
var API_CSA='https://script.google.com/macros/s/AKfycbxkJKfreWnlk8OZjS18maXcKNO4UblFEiaOwcBpe2VZYm5fs3CmlKEjwNqETak_ObJa/exec';
var PIN='';try{PIN=localStorage.getItem('gaussPinFran')||'';}catch(e){}
var GR=null,INFO=null,PN=null;
// ⚡ Supabase: copia rápida (solo lectura). Si falla o no está, se usa la planilla como siempre.
var SB_URL='https://heycvwxaewjbwbusddqg.supabase.co',SB_KEY='sb_publishable_MpClcQrbgiAtqcsaa5js3w_XCYqHztI';
function sbLeer(tipo,clave,ok,mal){
 if(!PIN){mal();return;}
 var hecho=false,to=setTimeout(function(){if(!hecho){hecho=true;mal();}},4000);
 fetch(SB_URL+'/rest/v1/rpc/gauss_leer',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
  body:JSON.stringify({p_pin:PIN,p_tipo:tipo,p_clave:String(clave)})})
 .then(function(r){return r.json();})
 .then(function(d){if(hecho)return;hecho=true;clearTimeout(to);if(d&&d.datos)ok(d.datos,d.t);else mal();})
 .catch(function(){if(hecho)return;hecho=true;clearTimeout(to);mal();});}
function el(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function msg(t){el('msg').innerHTML=t||'';}
function guardado(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v);}catch(e){return '';}}
function hoyIso(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function isoMas(iso,n){var p=iso.split('-').map(Number),d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));return d.toISOString().slice(0,10);}
function fecha(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'/'+p[1];}
function llamar(api,acc,params,ok,mal){
 var q='accion='+acc+'&pin='+encodeURIComponent(PIN);
 for(var k in params)q+='&'+k+'='+encodeURIComponent(params[k]==null?'':params[k]);
 fetch(api+'?'+q,{credentials:'omit'}).then(function(r){return r.json();})
 .then(function(d){if(d&&d.error)mal({message:d.error});else ok(d);})
 .catch(function(){mal({message:'No pude conectar ('+(api===API_CSA?'CSA':'Administración')+'). Revisá la conexión y probá de nuevo.'});});}
function adm(a,p,ok,mal){llamar(API_ADM,a,p,ok,mal);}
function csa(a,p,ok,mal){llamar(API_CSA,a,p,ok,mal);}
function falla(e,dest){var m=String(e.message||e);
 if(m.indexOf('PIN:')>=0&&!dest){pedirPin(m.replace(/^.*PIN:\s*/,''));return;}
 m=m.replace(/^.*PIN:\s*/,'PIN: ');
 if(dest&&el(dest))el(dest).innerHTML='<div class="err">⚠️ '+esc(m)+'</div>';else msg('<span class="err">⚠️ '+esc(m)+'</span>');}
function pedirPin(m){el('volver').style.display='none';msg('');
 el('app').innerHTML='<div class="card" style="text-align:center"><h2>🔒 Panel de Fran</h2><div style="margin-bottom:10px;color:'+(m.indexOf('Ingres')===0?'#555':'#c0392b')+'">'+esc(m)+'</div>'+
 '<input id="pin" type="password" placeholder="PIN" style="font-size:22px;width:180px;text-align:center"><br><button class="btn" style="width:auto;display:inline-block;padding:12px 34px" onclick="entrar()">Entrar</button></div>';
 var i=el('pin');i.focus();i.onkeydown=function(ev){if(ev.key==='Enter')entrar();};}
function entrar(){PIN=el('pin').value.trim();guardado('gaussPinFran',PIN);cargar();}
function cargar(){el('app').innerHTML='';msg('Cargando…');
 var listo=0,fin=function(){if(++listo===2)inicio();};
 // copia rápida de Supabase; después se confirma con las planillas sin hacer esperar
 var gP=function(cb){adm('franGrupos',{},function(d){GR=d;if(cb)cb();},function(e){if(cb)falla(e);else if(String(e.message||'').indexOf('PIN:')>=0)falla(e);});};
 var iP=function(cb){csa('franInfo',{},function(d){INFO=d;if(cb)cb();},function(e){if(cb)falla(e);});};
 sbLeer('franGrupos','todo',function(d){GR=d;fin();gP();},function(){gP(fin);});
 sbLeer('franInfo','todo',function(d){INFO=d;fin();iP();},function(){iP(fin);});}
cargar();

// ◀ Volver atrás con el gesto del celular (deslizar) o la flecha del navegador: cada pantalla queda en el historial
var HIST=[],HIST_OK=!!(window.history&&history.pushState);
function guardarPantalla(){if(!HIST_OK||!el('app'))return;var v=el('volver')?el('volver').style.display:'';
 HIST.push({h:el('app').innerHTML,y:window.scrollY,v:v});if(HIST.length>30)HIST.shift();try{history.pushState({gauss:HIST.length},'');}catch(e){}}
window.addEventListener('popstate',function(){if(typeof NAV!=='undefined')NAV++;var s=HIST.pop();
 if(!s||s.v==='none'||s.v===''){HIST=[];inicio(true);return;}
 el('app').innerHTML=s.h;if(el('volver'))el('volver').style.display=s.v;if(typeof msg==='function')msg('');try{if(typeof sbMarca==='function')sbMarca('');}catch(e){}
 setTimeout(function(){window.scrollTo(0,s.y);},0);});
function pantalla(h){guardarPantalla();el('volver').style.display='inline-block';msg('');el('app').innerHTML=h;window.scrollTo(0,0);}

// ---------- INICIO ----------
function inicio(desdeHist){if(!desdeHist)HIST=[];el('volver').style.display='none';msg('');window.scrollTo(0,0);
 el('app').innerHTML='<div class="botones">'+
  '<button class="bgrande" style="background:#c0392b" onclick="semanal()">📊 Resumen semanal<small>Académico + económico · sábado a viernes</small></button>'+
  '<button class="bgrande" style="background:#1f4e79" onclick="especifico()">🎯 Resumen específico<small>Fechas y grupos a elección · por coordinador</small></button>'+
  '<button class="bgrande" style="background:#6a1b9a" onclick="pdfNotas()">🖨️ PDF de notas<small>Un examen o todos, de un grupo</small></button>'+
  '<button class="bgrande" style="background:#00838f" onclick="lista()">📋 Crear lista de llamado<small>Desde el celular</small></button>'+
  '<button class="bgrande" style="background:#2e7d32" onclick="horario()">📥 Cargar horario de la semana<small>Excel de Carlos → exámenes al calendario + docente y materia en las listas FIUNA</small></button>'+
  '<button class="bgrande" style="background:#ad1457" onclick="reparto()">👥 Repartir grupo<small>Pasar muchos alumnos de un grupo a otro (ej. INT 11 nov → INT 5)</small></button>'+
  '<button class="bgrande" style="background:#0277bd" onclick="contactos()">📇 Exportar contactos<small>CSV para Google Contactos · alumnos y responsables por grupo o modalidad</small></button>'+
  '<button class="bgrande" style="background:#455a64" onclick="historial()">📁 Historial<small>Lo último que generaste</small></button>'+
  '</div><div class="card" style="margin-top:14px"><div class="auto"><div><b>⏰ Resumen semanal automático</b><div class="ayuda">Los viernes a las 19 h se generan solos los dos PDFs (sin mail). Abrís el panel y compartís.</div></div>'+
  '<button class="sw off" id="swA" onclick="auto()">…</button></div></div>';
 verAuto();}
var AUTO=null;
function verAuto(modo){var r={},n=0,fin=function(){if(++n<2)return;AUTO=r.a&&r.c;var b=el('swA');if(!b)return;
  b.className='sw '+(AUTO?'on':'off');b.textContent=AUTO?'✅ Activado':(r.a||r.c?'⚠️ A medias':'Apagado');b.disabled=false;};
 adm('franAuto',{modo:modo||'ver'},function(d){r.a=d.activo;fin();},function(e){r.a=false;fin();});
 csa('franAuto',{modo:modo||'ver'},function(d){r.c=d.activo;fin();},function(e){r.c=false;fin();});}
function auto(){var b=el('swA');b.disabled=true;b.textContent='…';verAuto(AUTO?'off':'on');}

// ---------- PDFs: ver, descargar, compartir ----------
function tarjeta(r,api){var id='p'+Math.random().toString(36).slice(2,8);
 var cuando=r.t?new Date(r.t).toLocaleString('es-PY',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
 return '<div class="pdf"><b>'+(r.tipo==='Económico'?'💰 ':(r.tipo==='Lista'?'📋 ':'📘 '))+esc(r.nombre.replace(/\.pdf$/,''))+'</b><small>'+(r.ya?'Ya estaba generado · ':'')+esc(cuando)+'</small><br>'+
  (r.url?'<a class="acc" style="background:#1f4e79" href="'+esc(r.url)+'" target="_blank">📂 Abrir</a>':
  '<button class="acc" style="background:#1f4e79" onclick="archivo(\''+api+'\',\''+esc(r.id)+'\',\'ver\',this)">👁️ Ver</button>'+
  '<button class="acc" style="background:#555" onclick="archivo(\''+api+'\',\''+esc(r.id)+'\',\'bajar\',this)">⬇️ Descargar</button>'+
  '<button class="acc" style="background:#25d366" onclick="archivo(\''+api+'\',\''+esc(r.id)+'\',\'compartir\',this)">📲 Compartir</button>')+'<div id="'+id+'"></div></div>';}
var CACHE_PDF={};
function archivo(api,id,modo,b){var txt=b.textContent,ventana=null;b.disabled=true;b.textContent='…';
 if(modo==='ver')ventana=window.open('','_blank');
 var usar=function(d){b.disabled=false;b.textContent=txt;CACHE_PDF[id]=d;
  var bin=atob(d.b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  var blob=new Blob([u],{type:d.mime||'application/pdf'}),url=URL.createObjectURL(blob);
  if(modo==='ver'){if(ventana)ventana.location=url;else window.open(url,'_blank');return;}
  if(modo==='compartir'){var f=null;try{f=new File([blob],d.nombre,{type:d.mime||'application/pdf'});}catch(e){}
   if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:d.nombre}).catch(function(){});return;}
   alert('Este navegador no puede compartir archivos directo: lo descargo y lo adjuntás en WhatsApp.');}
  var a=document.createElement('a');a.href=url;a.download=d.nombre;document.body.appendChild(a);a.click();a.remove();};
 if(CACHE_PDF[id]){usar(CACHE_PDF[id]);return;}
 llamar(api==='csa'?API_CSA:API_ADM,'franArchivo',{id:id},usar,function(e){b.disabled=false;b.textContent=txt;if(ventana)ventana.close();alert('⚠️ '+(e.message||e));});}

// ---------- 📊 RESUMEN SEMANAL ----------
function sabVie(anterior){var d=new Date(),dow=d.getDay(),v=new Date(d);
 v.setDate(d.getDate()+(dow===5?0:(dow===6||dow===0?-((dow+2)%7):5-dow))-(anterior?7:0));
 var s=new Date(v);s.setDate(v.getDate()-6);var f=function(x){return ('0'+x.getDate()).slice(-2)+'/'+('0'+(x.getMonth()+1)).slice(-2);};return f(s)+' al '+f(v);}
function semanal(){pantalla('<div class="card"><h2>📊 Resumen semanal</h2>'+
  '<label>Semana</label><select id="sS"><option value="0">Esta semana · sábado '+sabVie(false).replace(' al ',' → viernes ')+'</option><option value="1">Semana anterior · '+sabVie(true)+'</option></select>'+
  '<div class="ayuda" style="margin-top:6px">Si ya estaba generado (por ejemplo el automático del viernes), lo trae al instante.</div>'+
  '<button class="btn" id="sB" onclick="genSemanal(0)">📊 Generar académico + económico</button><div id="sR"></div></div>'+
  '<div class="card"><h2>🧪 Académico nuevo (prueba)</h2><div class="ayuda">Formato corto: una tabla por grupo. Se guarda en otra carpeta (RESÚMENES SEMANALES (PRUEBA)); el de siempre no cambia.</div>'+
  '<button class="btn" id="sN" style="background:#6a1b9a" onclick="genNuevo()">🧪 Generar el académico nuevo</button><div id="sNR"></div></div>');}
function genNuevo(){var b=el('sN');b.disabled=true;b.textContent='Generando… (puede tardar un minuto)';el('sNR').innerHTML='';
 csa('franSemanal',{anterior:el('sS').value,nuevo:'1'},function(r){b.disabled=false;b.textContent='🧪 Generar el académico nuevo';el('sNR').innerHTML=tarjeta(r,'csa');},
  function(e){b.disabled=false;b.textContent='🧪 Generar el académico nuevo';falla(e,'sNR');});}
function genSemanal(force){var b=el('sB'),ant=el('sS').value;b.disabled=true;b.textContent='Generando… (puede tardar un minuto)';
 el('sR').innerHTML='<div id="sA" class="pdf">📘 Académico: generando…</div><div id="sE" class="pdf">💰 Económico: generando…</div>';
 var n=0,fin=function(){if(++n<2)return;b.disabled=false;b.textContent='📊 Generar académico + económico';
  el('sR').insertAdjacentHTML('beforeend','<button class="btn gr" style="font-size:15px;padding:10px" onclick="genSemanal(1)">🔄 Volver a generar con los datos de ahora</button>');};
 csa('franSemanal',{anterior:ant,force:force},function(r){el('sA').outerHTML=tarjeta(r,'csa');fin();},function(e){falla(e,'sA');fin();});
 adm('franSemanal',{anterior:ant,force:force},function(r){el('sE').outerHTML=tarjeta(r,'adm');fin();},function(e){falla(e,'sE');fin();});}

// ---------- 🎯 RESUMEN ESPECÍFICO ----------
var SEL={},COORD='';
function vigentes(){return GR.grupos.filter(function(g){return g.vigente||el('eTodos')&&el('eTodos').checked;});}
function especifico(){SEL={};COORD='';
 var coords={};GR.grupos.forEach(function(g){if(g.enc&&g.vigente)coords[g.enc]=1;});
 var cursos={};GR.grupos.forEach(function(g){if(g.vigente)cursos[(g.curso||'Otros')+(g.mod?' '+g.mod:'')]=1;});
 pantalla('<div class="card"><h2><span class="paso">1</span>¿Qué resumen?</h2>'+
  '<label style="font-weight:normal"><input type="checkbox" id="eA" checked>📘 Académico</label>'+
  '<label style="font-weight:normal"><input type="checkbox" id="eE">💰 Económico <span class="ayuda">(cobrado y deuda de esos grupos; sin gastos)</span></label></div>'+
  '<div class="card"><h2><span class="paso">2</span>¿De qué grupos?</h2>'+
  '<div class="ayuda">Por coordinador (marca sus grupos):</div><div>'+(Object.keys(coords).length?Object.keys(coords).sort().map(function(c){return '<span class="chip" data-c="'+esc(c)+'" onclick="porCoord(this)">'+esc(c)+'</span>';}).join(''):'<span class="ayuda">Cargá PROFESOR ENCARGADO en GRUPOS de Administración.</span>')+'</div>'+
  '<div class="ayuda" style="margin-top:10px">Rápido por curso:</div><div>'+Object.keys(cursos).sort().map(function(c){return '<span class="chip" data-k="'+esc(c)+'" onclick="porCurso(this)">Todos '+esc(c)+'</span>';}).join('')+
  '<span class="chip" onclick="SEL={};COORD=\'\';pintarGr()">✕ Ninguno</span></div>'+
  '<div id="eG"></div><label style="font-weight:normal;margin-top:10px"><input type="checkbox" id="eTodos" onchange="pintarGr()">Mostrar también grupos que ya terminaron</label></div>'+
  '<div class="card"><h2><span class="paso">3</span>¿Qué fechas?</h2><div id="eUlt"></div>'+
  '<div class="fila"><div><label>Desde</label><input type="date" id="eD" value="'+isoMas(hoyIso(),-6)+'"></div><div><label>Hasta</label><input type="date" id="eH" value="'+hoyIso()+'"></div></div>'+
  '<button class="btn" id="eB" onclick="genEsp()">🎯 Generar</button><div id="eR"></div></div>');
 pintarGr();}
function claveCurso(g){return (g.curso||'Otros')+(g.mod?' '+g.mod:'');}
function pintarGr(){var por={};vigentes().forEach(function(g){(por[claveCurso(g)]=por[claveCurso(g)]||[]).push(g);});
 el('eG').innerHTML=Object.keys(por).sort().map(function(k){return '<div class="gr-curso"><b>'+esc(k)+'</b><br>'+por[k].map(function(g){
  return '<span class="gr-item'+(SEL[g.cod]?' on':'')+'" onclick="toggleG(\''+esc(g.cod)+'\')">'+(SEL[g.cod]?'☑️ ':'⬜ ')+esc(g.nombre)+'</span>';}).join('')+'</div>';}).join('');
 [].forEach.call(document.querySelectorAll('.chip[data-c]'),function(c){c.className='chip'+(c.getAttribute('data-c')===COORD?' on':'');});
 var n=Object.keys(SEL).length;el('eB').textContent='🎯 Generar'+(n?' ('+n+' grupo'+(n>1?'s':'')+')':' (todos los grupos)');}
function toggleG(c){if(SEL[c])delete SEL[c];else SEL[c]=1;pintarGr();}

 el('cW').innerHTML='<div class="ayuda">Se descarga un archivo CSV para importar en Google Contactos (contacts.google.com → Importar). Alumno: APELLIDO NOMBRE GRUPO · Responsable: TUTORGRUPO APELLIDO NOMBRE (uno por hijo).</div>'+
  '<label>¿De quién?</label><select id="cQ"><option value="ambos">Alumnos y responsables</option><option value="alumnos">Solo alumnos</option><option value="responsables">Solo responsables (tutores)</option></select>'+

function ctPintar(){
 var mods={},cursos={};CT.grupos.forEach(function(g){if(g.mod)mods[g.mod]=1;if(g.curso)cursos[g.curso]=1;});
 var ch='<span class="ct-chip'+(ctTodosOn(CT.grupos)?' on':'')+'" onclick="ctGrupoSet(\'*\',\'\')">Todos los grupos</span>';

 Object.keys(cursos).sort().forEach(function(m){ch+='<span class="ct-chip'+(ctTodosOn(ctSeleccion(function(g){return g.curso===m;}))?' on':'')+'" data-v="'+esc(m)+'" onclick="ctGrupoSet(\'c\',this.getAttribute(\'data-v\'))">Todos '+esc(m)+'</span>';});

 var gs=CT.grupos.filter(function(g){return tipo==='*'||(tipo==='m'&&g.mod===v)||(tipo==='c'&&g.curso===v);});

  h+='<div class="aviso">Para importar: entrá a <b>contacts.google.com</b> → <b>Importar</b> → elegí el archivo. Cada contacto queda con una etiqueta (el grupo, o "TUTORES grupo"): si te equivocás, borrás los contactos de esa etiqueta. No lo importes dos veces.</div>';
  r.innerHTML=h;ctBajar();},
  function(e){b.disabled=false;ctPintar();falla(e,'cR');});}

// ---------- 📥 HORARIO SEMANAL DE CARLOS ----------
function val(id){var e=el(id);return e?String(e.value||""):"";}
var HOR=null;
function postCSA(acc,params,ok,mal){var b={accion:acc,pin:PIN};for(var k in params)b[k]=params[k];
 fetch(API_CSA,{method:'POST',body:JSON.stringify(b),credentials:'omit'}).then(function(r){return r.json();})
 .then(function(d){if(d&&d.error)mal({message:d.error});else ok(d);})
 .catch(function(){mal({message:'No pude conectar con el CSA. Revisá la conexión y probá de nuevo.'});});}
function cargarXLSX(fn){if(window.XLSX){fn();return;}var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
 s.onload=fn;s.onerror=function(){msg('<span class="err">⚠️ No pude cargar el lector de Excel. Revisá la conexión.</span>');};document.head.appendChild(s);}
function horario(){HOR=null;pantalla('<div class="card"><h2>📥 Cargar horario de la semana</h2>'+
 '<div class="ayuda">Subí el Excel de Carlos. Se leen solo los grupos <b>FIUNA</b>: los <b>exámenes</b> van al 📅 calendario (y salen las alertas de ausencia), '+
 'TAREA / DESCANSO / terminar ejercicios quedan como <b>🚫 sin clase</b>, y en las listas de esa semana se completan solas las filas <b>DOCENTE</b> y <b>MATERIA</b>.</div>'+
 '<label>Archivo de Excel</label><input type="file" id="hF" accept=".xlsx,.xls" onchange="leerHorario()">'+
 '<div id="hR"></div></div>');}
var MESES_H=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function sinTilde(s){return String(s==null?'':s).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();}
// "Octubre_26_al_31.xlsx" → lunes de esa semana
function lunesDeArchivo(nombre){var n=sinTilde(nombre).replace(/_/g,' '),m=-1;MESES_H.forEach(function(x,i){if(n.indexOf(sinTilde(x))>=0)m=i;});
 var d=(n.match(/(\d{1,2})/)||[])[1];if(m<0||!d)return '';var hoy=new Date(),y=hoy.getFullYear();if(m<hoy.getMonth()-6)y++;
 var f=new Date(Date.UTC(y,m,Number(d))),w=f.getUTCDay();f=new Date(f.getTime()-((w+6)%7)*864e5);return f.toISOString().slice(0,10);}
function lunesDeHoy(){var h=hoyIso(),p=h.split('-').map(Number),f=new Date(Date.UTC(p[0],p[1]-1,p[2])),w=f.getUTCDay();
 return new Date(f.getTime()+(w===0?1:-(w-1))*864e5).toISOString().slice(0,10);}
var DIAS_H=['LUNES','MARTES','MIERCOLES','JUEVES','VIERNES','SABADO'];
// Celda → {k: E examen | S sin clase | C clase, mat, prof}
function celdaHorario(txt){var t=String(txt||'').replace(/\r/g,'').trim();if(!t)return null;var n=sinTilde(t);
 if(/^(TAREA|DESCANSO|TERMINAR EJERCICIOS)/.test(n))return {k:'S',mat:'',prof:'',txt:t.replace(/\s+/g,' ')};
 var mat=t.split('.')[0].trim(),prof='',m=t.match(/\s{3,}([^\s].*?)\s*$/);
 if(m&&m[1].length<=25)prof=m[1].trim();
 else{var partes=t.split('.').map(function(x){return x.trim();}).filter(function(x){return x;}),u=partes[partes.length-1]||'';
  var w=u.split(/\s+/),ult=w.slice(-1)[0]||'';if(partes.length>1&&ult&&/^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+$/.test(ult)&&!/^(Ejercicios|Examen|Teoria|Repaso|Capitulo|Rectas|Vectores|Triangulos|Principia|Generales|Trigo|Geo)$/i.test(ult))prof=ult;}
 var ex=/\bEXAMEN\b/.test(n.replace(/PRE[\s-]*EXAMEN/g,''));   // "Miscelánea pre examen" no es examen
 return {k:ex?'E':'C',mat:mat,prof:prof,txt:t.replace(/\s{2,}/g,' ').slice(0,120)};}
function leerHorario(){var f=el('hF').files[0],r=el('hR');if(!f)return;r.innerHTML='<div class="ayuda">Leyendo el Excel…</div>';
 cargarXLSX(function(){var fr=new FileReader();fr.onload=function(ev){try{
  var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'}),nom=wb.SheetNames.filter(function(s){return /HORARIO/i.test(s);})[0]||wb.SheetNames[0];
  var A=XLSX.utils.sheet_to_json(wb.Sheets[nom],{header:1,defval:'',raw:false}),items=[],grupos={};
  for(var i=0;i<A.length-3;i++){var fila=A[i];
   for(var c=0;c<fila.length;c++){var g=sinTilde(fila[c]);if(!/^FIUNA (EXT|COL|INT)\b/.test(g))continue;
    var dia=sinTilde((A[i+1]||[])[c]),d=-1;DIAS_H.forEach(function(x,k){if(dia.indexOf(x)===0)d=k;});if(d<0)continue;
    [0,1].forEach(function(t){var x=celdaHorario((A[i+2+t]||[])[c]);if(!x)return;grupos[g]=1;
     items.push({g:String(fila[c]).replace(/\s+/g,' ').trim(),d:d,t:t,k:x.k,mat:x.mat,prof:x.prof,txt:x.txt});});}}
  if(!items.length){r.innerHTML='<div class="err">No encontré grupos FIUNA en la hoja "'+esc(nom)+'".</div>';return;}
  HOR={items:items,archivo:f.name};var lu=lunesDeArchivo(f.name)||lunesDeHoy();
  r.innerHTML='<div class="ok" style="margin-top:10px">Leí <b>'+items.length+' turnos</b> de '+Object.keys(grupos).length+' grupos FIUNA ('+items.filter(function(x){return x.k==='E';}).length+' con examen).</div>'+
   '<label>Semana (lunes)</label><input type="date" id="hL" value="'+lu+'">'+
   '<label style="font-weight:normal;margin-top:8px"><input type="checkbox" id="hP" style="width:auto"> Pisar el docente / materia que ya estén escritos en las listas</label>'+
   '<button class="btn" id="hV" onclick="previaHorario()">👁️ Ver qué se va a cargar</button><div id="hPrev"></div>';
 }catch(e){r.innerHTML='<div class="err">⚠️ No pude leer el archivo: '+esc(e.message||e)+'</div>';}};fr.readAsArrayBuffer(f);});}
function datosHorario(){return {lunes:val('hL'),items:HOR.items};}
function previaHorario(){var d=el('hPrev'),b=el('hV');if(!HOR)return;if(!val('hL')){d.innerHTML='<div class="err">Elegí la semana.</div>';return;}
 b.disabled=true;b.textContent='Revisando… (unos segundos)';d.innerHTML='';
 postCSA('franHorario',{datos:datosHorario(),confirmar:'0',pisar:el('hP').checked?'1':''},function(r){b.disabled=false;b.textContent='👁️ Ver qué se va a cargar';d.innerHTML=htmlHorario(r)+
   '<button class="btn" style="background:#1b8a3a" id="hC" onclick="cargarHorario()">✅ Cargar en el calendario y las listas</button><div id="hM"></div>';},
  function(e){b.disabled=false;b.textContent='👁️ Ver qué se va a cargar';falla(e,'hPrev');});}
function lista2(t,l,col){return l&&l.length?'<div style="margin-top:8px;background:'+(col||'#fff2cc')+';border-radius:8px;padding:8px"><b>'+t+'</b><div style="font-size:14px">'+l.map(esc).join(' · ')+'</div></div>':'';}
function htmlHorario(r){
 return '<div class="card" style="margin-top:10px;background:#f7f9fc"><b>Semana del '+esc(r.semana)+'</b>'+
  '<div style="margin-top:6px">📝 <b>'+r.examenes.length+' exámenes</b> al calendario'+(r.examenes.length?':':'')+'</div>'+
  r.examenes.map(function(x){return '<div style="font-size:14px;margin-left:10px">• '+esc(x.g)+' · '+esc(x.dia)+' '+esc(x.turno)+' · <b>'+esc(x.mat)+'</b></div>';}).join('')+
  '<div style="margin-top:6px">🚫 <b>'+r.sinClase+' turnos sin clase</b> (tarea, descanso, terminar ejercicios)</div>'+
  '<div style="margin-top:6px">📋 <b>'+r.celdas+' casillas</b> de DOCENTE / MATERIA para completar en: '+(r.listas.length?esc(r.listas.join(', ')):(!r.celdas&&!(r.sinLista&&r.sinLista.length)?'<span style="color:#1b8a3a">✅ ninguna: las listas de esa semana ya estaban completas</span>':'<span class="err" style="display:inline">ninguna lista</span>'))+
  (r.yaTenian?' <span class="ayuda">('+r.yaTenian+' ya tenían otro valor y no se tocan; tildá "pisar" para cambiarlas)</span>':'')+'</div>'+
  '<div style="margin-top:6px">🙈 <b>'+(r.ocultar||0)+' turnos sin clase</b> se ocultan en las listas'+(r.mostrar?' · <b>'+r.mostrar+'</b> se vuelven a mostrar':'')+
  ' <span class="ayuda">(no se borran: se ven tocando las flechitas ◀▶ del encabezado)</span></div>'+
  lista2('⚠️ Turnos sin clase que ya tienen marcas P/A/J (no se ocultan):',r.conMarcas)+
  lista2('⚠️ Grupos que no existen en el CSA (se saltean):',r.sinGrupo)+
  lista2('⚠️ Grupos sin lista creada para esa semana (no se completa docente/materia):',r.sinLista)+
  lista2('⚠️ Materias sin equivalencia (hoja MATERIAS, columnas H e I):',r.sinMateria)+
  lista2('⚠️ Apodos de profes sin docente (hoja PROFES HORARIO):',r.sinProfe)+
  (r.apodosNuevos&&r.apodosNuevos.length?'<div style="margin-top:8px;background:#eaf2fb;border-radius:8px;padding:8px"><b>👤 Apodos nuevos</b> (se agregan a PROFES HORARIO; revisá que estén bien):'+
   r.apodosNuevos.map(function(a){return '<div style="font-size:14px">'+esc(a.apodo)+' → '+(a.docente?esc(a.docente):'<span style="color:#c0392b">sin adivinar: completalo en la hoja</span>')+'</div>';}).join('')+'</div>':'')+
  lista2('Avisos:',r.avisos)+'</div>';}
function cargarHorario(){var b=el('hC'),m=el('hM');if(!confirm('¿Cargar el horario de la semana en el calendario y las listas?'))return;
 b.disabled=true;b.textContent='Cargando… (puede tardar un poco)';
 postCSA('franHorario',{datos:datosHorario(),confirmar:'1',pisar:el('hP').checked?'1':''},function(r){
   pantalla('<div class="card ok"><b style="font-size:19px">✅ Horario cargado</b>'+htmlHorario(r)+
    '<div class="ayuda" style="margin-top:8px">Si volvés a cargar el horario de la misma semana, se reemplaza lo que se cargó antes en el calendario (no se duplica).</div>'+
    '<button class="btn" onclick="inicio()">⬅ Volver al inicio</button></div>');},
  function(e){b.disabled=false;b.textContent='✅ Cargar en el calendario y las listas';falla(e,'hM');});}

</script></body></html>
